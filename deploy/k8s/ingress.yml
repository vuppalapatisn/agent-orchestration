apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-orchestration
  namespace: agent-orchestration
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-orchestration
                port:
                  number: 80
