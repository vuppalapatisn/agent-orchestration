server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: agent-orchestration-production
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: false
  task:
    execution:
      thread-name-prefix: agent-exec-
  datasource:
    url: jdbc:h2:mem:agentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  ai:
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
        api-key: ${AZURE_OPENAI_API_KEY:replace-me}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-mini}
            temperature: 0.2
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        initialized: true
        request-timeout: 20s
        type: SYNC
        toolcallback:
          enabled: true
        stdio:
          servers-configuration: classpath:/mcp-servers-config.json
        sse:
          connections:
            ops-server:
              url: ${MCP_SSE_URL:http://localhost:8090}

app:
  security:
    user: ${APP_SECURITY_USER:agentadmin}
    password: ${APP_SECURITY_PASSWORD:changeit-changeit}
  workers:
    timeout-seconds: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    org.springframework.security: INFO
    com.example.agentorchestration: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: ${spring.application.name}
    description: Production-grade agent orchestration with Azure OpenAI and MCP
